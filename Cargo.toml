[package]
name = "hex-terrain"
version = "0.1.0"
edition = "2024"

[dependencies]
# `free_camera` is a Bevy feature, not a third-party crate: it enables the first-party
# `bevy_camera_controller`, which is what flies the camera. See spec/camera-controls.md.
bevy = { version = "0.19", features = ["free_camera"] }

# The scene report only (`src/probe/report.rs`). A typed schema is what keeps machine-read output
# from drifting silently as fields are added; hand-rolled JSON would not. Nothing else in the crate
# derives Serialize — see spec/instrumentation.md.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Argument parsing (`src/main.rs`). Admitted once the shell grew a second knob: with `--scene` and
# `--inset` there is a grammar to get wrong, a `--help` worth printing, and a valid-name list worth
# generating rather than writing twice. See spec/scene.md.
clap = { version = "4", features = ["derive"] }

# Link bevy as a shared library so an edit-rebuild cycle relinks ~20 MB instead of ~1.7 GB.
# Scoped to non-wasm because the feature does not build for wasm at all. Binaries built this
# way need libbevy_dylib.so at runtime, which `cargo run` handles but a bare copy does not.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy = { version = "0.19", features = ["dynamic_linking", "free_camera"] }

# Debug builds of bevy are unusably slow without this.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
