<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>hex-terrain</title>
    <link data-trunk rel="rust" />
    <!-- Only the shaders are fetched at runtime; copying all of assets/ would add 11 MB of
         unwired starmap to every build. data-target-path keeps the runtime path intact. -->
    <link data-trunk rel="copy-dir" href="assets/shaders" data-target-path="assets/shaders" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body></body>
</html>
